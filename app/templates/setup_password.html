<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password — Impera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#C9A84C',
                        'accent-light': '#E5C878',
                    },
                    fontFamily: {
                        'display': ['Bangers', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .comic-border { border: 3px solid #000; box-shadow: 4px 4px 0px #000; }
        .speech-bubble {
            position: relative;
            background: #E31837;
            color: white;
            padding: 1rem;
            border-radius: 0.5rem;
            border: 2px solid #000;
        }
    </style>
</head>
<body class="bg-[#0a0a0a] text-[#F5F0E6] min-h-screen flex items-center justify-center px-6">
    <div class="w-full max-w-md">
        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-6xl font-display text-accent">IMPERA</h1>
            <p class="text-gray-400 mt-2">Set Your Password</p>
        </div>

        {% if invalid %}
        <div class="speech-bubble mb-6 text-center font-bold">
            {{ error }}
        </div>
        <div class="text-center mt-6">
            <a href="/masukgan" class="text-gray-500 hover:text-accent text-sm">← Back to Login</a>
        </div>
        {% else %}

        {% if error %}
        <div class="speech-bubble mb-6 text-center font-bold">
            {{ error }}
        </div>
        {% endif %}

        <div class="bg-[#111] comic-border p-6 mb-4 text-center">
            <p class="text-gray-400 text-sm">Setting password for</p>
            <p class="text-accent font-bold text-xl mt-1">{{ username }}</p>
        </div>

        <form method="POST" class="comic-border p-8" style="background: #111;">
            <div class="mb-6">
                <label class="block text-sm font-bold mb-2">New Password</label>
                <input
                    type="password"
                    name="password"
                    required
                    minlength="6"
                    class="w-full bg-[#0a0a0a] border-2 border-black px-4 py-3 focus:outline-none focus:border-accent"
                    placeholder="Min 6 characters"
                >
            </div>

            <div class="mb-8">
                <label class="block text-sm font-bold mb-2">Confirm Password</label>
                <input
                    type="password"
                    name="confirm_password"
                    required
                    class="w-full bg-[#0a0a0a] border-2 border-black px-4 py-3 focus:outline-none focus:border-accent"
                    placeholder="Repeat password"
                >
            </div>

            <button
                type="submit"
                class="w-full bg-accent text-black font-bold py-4 hover:bg-accent-light transition-colors comic-border"
            >
                SET PASSWORD
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="/masukgan" class="text-gray-500 hover:text-accent text-sm">← Back to Login</a>
        </div>
        {% endif %}
    </div>
</body>
</html>
