<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/impera-logo-only-white.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Scoring Board — Impera</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; background: #0a0a0a; color: #fff; }
        button { cursor: pointer; border: none; background: none; }
        input[type=number] { -moz-appearance: textfield; }
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }

        /* Portrait lock */
        #rotate-overlay { display: none; position: fixed; inset: 0; background: #0a0a0a; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; z-index: 99; }
        @media (orientation: portrait) {
            #rotate-overlay { display: flex; }
            #app { display: none !important; }
        }

        /* Layout */
        #app { height: 100dvh; display: flex; flex-direction: column; }

        /* Header */
        #header { display: flex; align-items: center; gap: 0.75rem; padding: 0.375rem 0.75rem; background: #111; border-bottom: 1px solid #1f1f1f; flex-shrink: 0; }

        /* Score section */
        #scores { display: flex; align-items: center; justify-content: center; gap: 1.5rem; padding: 0.4rem 1.5rem; border-bottom: 1px solid #1f1f1f; flex-shrink: 0; background: #0d0d0d; }
        .team-score { display: flex; align-items: center; gap: 0.5rem; }
        .team-label { display: flex; align-items: center; gap: 0.375rem; white-space: nowrap; }
        .color-dot { width: 0.5rem; height: 0.5rem; border-radius: 50%; flex-shrink: 0; }
        .team-name-text { font-size: 0.85rem; font-weight: 700; letter-spacing: 0.03em; }
        .adj-btn { width: 2rem; height: 2rem; border-radius: 0.5rem; background: #1f1f1f; border: 1px solid #2d2d2d; color: #fff; font-size: 1rem; font-weight: 700; transition: background 0.1s; display: flex; align-items: center; justify-content: center; }
        .adj-btn:hover { background: #2d2d2d; }
        .adj-btn:active { transform: scale(0.93); }
        .score-input { width: 3.25rem; text-align: center; font-size: 1.75rem; font-weight: 700; font-family: monospace; background: transparent; border: none; border-bottom: 2px solid #2d2d2d; color: #fff; padding: 0; outline: none; transition: border-color 0.15s; }
        .score-input:focus { border-bottom-color: #C9A84C; }
        .score-divider { color: #374151; font-size: 1rem; flex-shrink: 0; }

        /* Player section */
        #players { flex: 1; display: flex; overflow: hidden; min-height: 0; }
        .roster-col { overflow-y: auto; padding: 0.5rem; display: flex; flex-direction: column; gap: 0.125rem; min-width: 0; }
        .roster-col-label { font-size: 0.6rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: #6b7280; padding: 0.125rem 0.375rem 0.5rem; flex-shrink: 0; }
        .player-btn { width: 100%; padding: 0.3rem 0.5rem; border-radius: 0.4rem; font-size: 0.78rem; color: #d1d5db; text-align: left; transition: background 0.1s; flex-shrink: 0; }
        .player-btn:hover { background: #1a1a1a; }
        .player-btn.selected { background: rgba(201,168,76,0.2); color: #C9A84C; font-weight: 700; outline: 1px solid rgba(201,168,76,0.4); }
        .away-btn { text-align: right; }
        .pos-tag { font-size: 0.65rem; color: #6b7280; }

        /* Stat buttons column */
        #stat-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.4rem 0.75rem; border-left: 1px solid #1a1a1a; border-right: 1px solid #1a1a1a; overflow: hidden; }
        #selected-label { font-size: 1.1rem; font-weight: 700; color: #6b7280; margin-bottom: 0.25rem; min-height: 1.5rem; text-align: center; letter-spacing: 0.02em; }
        .stat-row { display: flex; align-items: center; gap: 0.3rem; }
        .stat-label { font-size: 0.6rem; color: #6b7280; width: 2rem; text-align: right; flex-shrink: 0; }
        .sbtn { display: inline-flex; align-items: center; justify-content: center; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 700; padding: 0.55rem 0.75rem; transition: all 0.1s; min-width: 2.5rem; min-height: 2.5rem; }
        .sbtn:active { transform: scale(0.9); }
        .sbtn.m { background: rgba(239,68,68,0.12); color: #fca5a5; }
        .sbtn.m:hover { background: rgba(239,68,68,0.25); }
        .sbtn.p { background: rgba(34,197,94,0.12); color: #86efac; }
        .sbtn.p:hover { background: rgba(34,197,94,0.25); }
        .stat-gap { width: 0.5rem; height: 1rem; border-right: 1px solid #2d2d2d; flex-shrink: 0; }
        .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.35rem; width: 100%; }

        /* Toast */
        #toast { position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%); background: #1f2937; color: #fff; padding: 0.4rem 1rem; border-radius: 0.625rem; font-size: 0.78rem; font-weight: 500; box-shadow: 0 4px 20px rgba(0,0,0,0.6); opacity: 0; pointer-events: none; z-index: 50; white-space: nowrap; transition: opacity 0.2s; }
    </style>
</head>
<body>

    <!-- Portrait overlay -->
    <div id="rotate-overlay">
        <svg style="width:2.5rem;height:2.5rem;color:#6b7280;animation:spin 2s linear infinite" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
        </svg>
        <p style="color:#9ca3af">Rotate to landscape</p>
        <style>@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>
    </div>

    <div id="app">

        <!-- Header -->
        <div id="header">
            <a href="/manage/games/{{ game.id }}?tab=scores"
               style="color:#6b7280;font-size:0.78rem;text-decoration:none;white-space:nowrap;flex-shrink:0;">← Back</a>
            <div style="width:1px;height:1.125rem;background:#2d2d2d;flex-shrink:0;"></div>
            <select id="match-select" onchange="onMatchChange()"
                    style="background:#1a1a1a;border:1px solid #2d2d2d;color:#fff;font-size:0.78rem;border-radius:0.5rem;padding:0.3rem 0.5rem;flex:1;max-width:24rem;outline:none;"></select>
        </div>

        <!-- Score section -->
        <div id="scores">
            <!-- Home -->
            <div class="team-score">
                <div class="team-label">
                    <span id="home-dot" class="color-dot"></span>
                    <span id="home-name" class="team-name-text"></span>
                </div>
                <button class="adj-btn" onclick="adjustScore('home',-1)">−</button>
                <input id="score-home" class="score-input" type="number" value="0" min="0"
                       onblur="setScore('home',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
                <button class="adj-btn" onclick="adjustScore('home',1)">+</button>
            </div>

            <div class="score-divider">—</div>

            <!-- Away -->
            <div class="team-score">
                <button class="adj-btn" onclick="adjustScore('away',-1)">−</button>
                <input id="score-away" class="score-input" type="number" value="0" min="0"
                       onblur="setScore('away',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
                <button class="adj-btn" onclick="adjustScore('away',1)">+</button>
                <div class="team-label">
                    <span id="away-dot" class="color-dot"></span>
                    <span id="away-name" class="team-name-text"></span>
                </div>
            </div>
        </div>

        <!-- Players + stats -->
        <div id="players">

            <!-- Home roster -->
            <div id="home-col" class="roster-col" style="width:22%;">
                <div id="home-col-label" class="roster-col-label"></div>
                <div id="home-roster"></div>
            </div>

            <!-- Stat buttons -->
            <div id="stat-col">
                <div id="selected-label">Select a player</div>
                <div id="player-stats" style="display:flex;gap:0.5rem;flex-wrap:nowrap;justify-content:center;min-height:1rem;overflow:hidden;"></div>

                <!-- Team comparison (shown when no player selected) -->
                <div id="team-comparison" style="width:100%;display:flex;flex-direction:column;gap:0.3rem;">
                    <div style="text-align:center;font-size:0.6rem;color:#4b5563;letter-spacing:0.1em;margin-bottom:0.25rem;">TEAM COMPARISON</div>
                    <div id="comparison-rows"></div>
                </div>

                <div id="stat-buttons" style="display:none;flex-direction:column;align-items:center;gap:0.4rem;width:100%;">
                <!-- Points -->
                <div class="stat-row">
                    <span class="stat-label">PTS</span>
                    <button class="sbtn m" onclick="recordStat('points',-3)">−3</button>
                    <button class="sbtn m" onclick="recordStat('points',-2)">−2</button>
                    <button class="sbtn m" onclick="recordStat('points',-1)">−1</button>
                    <div class="stat-gap"></div>
                    <button class="sbtn p" onclick="recordStat('points', 1)">+1</button>
                    <button class="sbtn p" onclick="recordStat('points', 2)">+2</button>
                    <button class="sbtn p" onclick="recordStat('points', 3)">+3</button>
                </div>

                <div class="stat-grid">
                {% for stat, label in [('rebounds','REB'),('assists','AST'),('steals','STL'),('blocks','BLK'),('turnovers','TO'),('fouls','FOUL')] %}
                <div class="stat-row" style="justify-content:center;">
                    <span class="stat-label">{{ label }}</span>
                    <button class="sbtn m" onclick="recordStat('{{ stat }}',-1)">−1</button>
                    <div style="width:0.3rem;flex-shrink:0;"></div>
                    <button class="sbtn p" onclick="recordStat('{{ stat }}', 1)">+1</button>
                </div>
                {% endfor %}
                </div><!-- /stat-grid -->
                </div><!-- /stat-buttons -->
            </div>

            <!-- Away roster -->
            <div id="away-col" class="roster-col" style="width:22%;text-align:right;">
                <div id="away-col-label" class="roster-col-label" style="text-align:right;"></div>
                <div id="away-roster"></div>
            </div>

        </div><!-- /players -->
    </div><!-- /app -->

    <div id="toast"></div>

    <script>
        const MATCHES = {{ matches_json | safe }};
        const ROSTERS = {{ rosters_json | safe }};
        const GAME_ID = {{ game.id }};

        let matchIdx = 0;
        let sel = null; // selected player: {id, name, teamId, side}
        let currentStats = {};
        let teamStatsCache = { home: {}, away: {} };
        const STAT_KEYS = ['points','rebounds','assists','steals','blocks','turnovers','fouls'];
        const STAT_LABELS = {points:'PTS',rebounds:'REB',assists:'AST',steals:'STL',blocks:'BLK',turnovers:'TO',fouls:'FOUL'};

        function curMatch() { return MATCHES[matchIdx]; }

        // Portrait check
        function checkOrientation() {
            const p = window.innerHeight > window.innerWidth;
            document.getElementById('rotate-overlay').style.display = p ? 'flex' : 'none';
        }
        window.addEventListener('resize', checkOrientation);
        checkOrientation();

        // Build match dropdown
        (function() {
            const s = document.getElementById('match-select');
            s.innerHTML = MATCHES.length
                ? MATCHES.map((m, i) => `<option value="${i}">Match ${m.match_order || i+1}: ${m.home_name || 'TBD'} vs ${m.away_name || 'TBD'}</option>`).join('')
                : '<option>No matches yet</option>';
        })();

        function onMatchChange() {
            matchIdx = parseInt(document.getElementById('match-select').value);
            renderMatch();
            renderRosters();
            deselect();
            fetchAndRenderComparison();
        }

        function renderMatch() {
            const m = curMatch();
            document.getElementById('home-name').textContent = m.home_name || 'TBD';
            document.getElementById('away-name').textContent = m.away_name || 'TBD';
            document.getElementById('home-dot').style.background = m.home_color || '#6B7280';
            document.getElementById('away-dot').style.background = m.away_color || '#6B7280';
            document.getElementById('score-home').value = m.score_home ?? 0;
            document.getElementById('score-away').value = m.score_away ?? 0;
            document.getElementById('home-col-label').textContent = m.home_name || 'Home';
            document.getElementById('away-col-label').textContent = m.away_name || 'Away';
        }

        const PDATA = {}; // player_id → {name, teamId, side}

        function renderRosters() {
            const m = curMatch();
            const home = ROSTERS[String(m.team_home_id)] || [];
            const away = ROSTERS[String(m.team_away_id)] || [];
            const sid = sel?.id;

            home.forEach(p => PDATA[p.player_id] = { name: p.name, teamId: m.team_home_id, side: 'home' });
            away.forEach(p => PDATA[p.player_id] = { name: p.name, teamId: m.team_away_id, side: 'away' });

            document.getElementById('home-roster').innerHTML = home.map(p =>
                `<button class="player-btn${sid===p.player_id?' selected':''}" id="pb-${p.player_id}"
                         onclick="selectPlayer(${p.player_id})">
                    ${esc(p.name)}${p.position_1?`<span class="pos-tag"> ${esc(p.position_1)}</span>`:''}
                 </button>`
            ).join('');

            document.getElementById('away-roster').innerHTML = away.map(p =>
                `<button class="player-btn away-btn${sid===p.player_id?' selected':''}" id="pb-${p.player_id}"
                         onclick="selectPlayer(${p.player_id})">
                    ${p.position_1?`<span class="pos-tag">${esc(p.position_1)} </span>`:''}${esc(p.name)}
                 </button>`
            ).join('');
        }

        function esc(s) {
            return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
        }

        async function fetchAndRenderComparison() {
            const m = curMatch();
            const r = await fetch(`/manage/games/${GAME_ID}/matches/${m.id}/team-stats`);
            if (r.ok) {
                const d = await r.json();
                teamStatsCache = d;
                renderComparison();
            }
        }

        function renderComparison() {
            const m = curMatch();
            const home = teamStatsCache.home;
            const away = teamStatsCache.away;
            const hc = m.home_color || '#6B7280';
            const ac = m.away_color || '#6B7280';
            const rows = document.getElementById('comparison-rows');
            rows.innerHTML = STAT_KEYS.map(k => {
                const hv = home[k] || 0;
                const av = away[k] || 0;
                const mx = Math.max(hv, av, 1);
                const hPct = Math.round((hv / mx) * 100);
                const aPct = Math.round((av / mx) * 100);
                const hScale = (hv / mx).toFixed(3);
                const aScale = (av / mx).toFixed(3);
                return `<div style="display:grid;grid-template-columns:1.5rem 1fr 2.25rem 1fr 1.5rem;align-items:center;gap:0.35rem;margin-bottom:0.2rem;">
                    <span style="text-align:right;font-size:0.75rem;font-weight:700;color:#e5e7eb;">${hv}</span>
                    <div style="overflow:hidden;">
                        <div style="width:100%;height:5px;background:#C9A84C;border-radius:3px;transform:scaleX(${hScale});transform-origin:right center;transition:transform 0.3s;"></div>
                    </div>
                    <span style="text-align:center;font-size:0.6rem;color:#6b7280;letter-spacing:0.05em;">${STAT_LABELS[k]}</span>
                    <div style="overflow:hidden;">
                        <div style="width:100%;height:5px;background:#ffffff;border-radius:3px;transform:scaleX(${aScale});transform-origin:left center;transition:transform 0.3s;"></div>
                    </div>
                    <span style="font-size:0.75rem;font-weight:700;color:#e5e7eb;">${av}</span>
                </div>`;
            }).join('');
        }

        function showComparison() {
            document.getElementById('team-comparison').style.display = 'flex';
            document.getElementById('player-stats').style.display = 'none';
        }

        function hideComparison() {
            document.getElementById('team-comparison').style.display = 'none';
            document.getElementById('player-stats').style.display = 'flex';
        }

        function renderStats() {
            const el = document.getElementById('player-stats');
            if (!sel) { el.innerHTML = ''; return; }
            el.innerHTML = STAT_KEYS.map(k =>
                `<span style="font-size:0.7rem;color:#6b7280;">${STAT_LABELS[k]} <span id="pstat-${k}" style="color:#e5e7eb;font-weight:700;">${currentStats[k] ?? 0}</span></span>`
            ).join('<span style="color:#2d2d2d;padding:0 0.1rem;">·</span>');
        }

        async function selectPlayer(id) {
            if (sel?.id === id) { deselect(); return; }
            const p = PDATA[id];
            if (!p) return;
            sel = { id, ...p };
            document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'));
            const btn = document.getElementById('pb-' + id);
            if (btn) btn.classList.add('selected');
            const lbl = document.getElementById('selected-label');
            lbl.textContent = p.name;
            lbl.style.color = '#C9A84C';
            document.getElementById('stat-buttons').style.display = 'flex';
            document.getElementById('stat-col').style.justifyContent = 'flex-start';
            document.getElementById('stat-col').style.paddingTop = '0.5rem';
            hideComparison();
            // Fetch current stats
            currentStats = {};
            renderStats();
            const m = curMatch();
            const r = await fetch(`/manage/games/${GAME_ID}/matches/${m.id}/player-stat/${id}`);
            if (r.ok) { const d = await r.json(); currentStats = d.stats || {}; renderStats(); }
        }

        function deselect() {
            sel = null;
            currentStats = {};
            document.querySelectorAll('.player-btn').forEach(b => b.classList.remove('selected'));
            const lbl = document.getElementById('selected-label');
            lbl.textContent = 'Select a player';
            lbl.style.color = '#6b7280';
            document.getElementById('stat-buttons').style.display = 'none';
            document.getElementById('stat-col').style.justifyContent = 'center';
            document.getElementById('stat-col').style.paddingTop = '0.4rem';
            renderStats();
            showComparison();
            fetchAndRenderComparison();
        }

        // Score API
        async function adjustScore(side, delta) {
            const m = curMatch();
            const field = side === 'home' ? 'score_home' : 'score_away';
            const r = await fetch(`/manage/games/${GAME_ID}/matches/${m.id}/score`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({field, delta})
            });
            if (r.ok) { const d = await r.json(); document.getElementById('score-'+side).value = d.value; m[field] = d.value; }
        }

        async function setScore(side, raw) {
            const m = curMatch();
            const field = side === 'home' ? 'score_home' : 'score_away';
            const value = Math.max(0, parseInt(raw)||0);
            document.getElementById('score-'+side).value = value;
            const r = await fetch(`/manage/games/${GAME_ID}/matches/${m.id}/score`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({field, value})
            });
            if (r.ok) { const d = await r.json(); m[field] = d.value; }
        }

        // Player stat API
        async function recordStat(stat, delta) {
            if (!sel) { showToast('Select a player first'); return; }
            const m = curMatch();
            const r = await fetch(`/manage/games/${GAME_ID}/matches/${m.id}/player-stat`, {
                method:'POST', headers:{'Content-Type':'application/json'},
                body: JSON.stringify({player_id: sel.id, team_id: sel.teamId, stat, delta})
            });
            if (r.ok) {
                const d = await r.json();
                showToast(`${sel.name}  ${delta>0?'+':''}${delta} ${STAT_LABELS[stat]}`);
                currentStats[stat] = d.value;
                const statEl = document.getElementById('pstat-' + stat);
                if (statEl) statEl.textContent = d.value;
                // Update team comparison cache
                const side = sel.side === 'home' ? 'home' : 'away';
                if (teamStatsCache[side]) {
                    teamStatsCache[side][stat] = (teamStatsCache[side][stat] || 0) + delta;
                    if (teamStatsCache[side][stat] < 0) teamStatsCache[side][stat] = 0;
                }
                if (stat === 'points' && d.team_score !== undefined) {
                    document.getElementById('score-'+sel.side).value = d.team_score;
                    m[d.score_field] = d.team_score;
                }
            } else {
                const err = await r.json().catch(() => ({}));
                showToast(`Error ${r.status}: ${err.error || 'failed'}`);
                console.error('player-stat error', r.status, err);
            }
        }

        // Toast
        let toastT;
        function showToast(msg) {
            const el = document.getElementById('toast');
            el.textContent = msg; el.style.opacity = '1';
            clearTimeout(toastT);
            toastT = setTimeout(() => el.style.opacity = '0', 1800);
        }

        // Init
        if (MATCHES.length) { renderMatch(); renderRosters(); fetchAndRenderComparison(); }
    </script>
</body>
</html>
