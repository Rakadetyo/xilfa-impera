<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/png" href="/assets/impera-logo-only-white.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Game — Impera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#C9A84C',
                        'accent-light': '#E5C878',
                    },
                    fontFamily: {
                        'display': ['Bangers', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex min-h-screen">
        {% include '_sidebar.html' %}

        <main class="ml-0 md:ml-64 pt-14 md:pt-0 flex-1 p-4 md:p-8">
            <div class="max-w-2xl">
                <div class="mb-6">
                    <a href="/manage/games/{{ game.id }}" class="text-gray-500 hover:text-accent">← Back to Game</a>
                </div>

                <h1 class="text-3xl font-display tracking-wide mb-8">Edit Game</h1>

                <form method="post" class="bg-white rounded-xl p-6 border border-gray-200 shadow-sm space-y-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Date & Time</label>
                        <input type="datetime-local" name="datetime" value="{{ game.datetime[:16] }}" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Arena</label>
                        <select name="arena_id" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            <option value="">Select arena</option>
                            {% for arena in arenas %}
                            <option value="{{ arena.id }}" {% if arena.id == game.arena_id %}selected{% endif %}>{{ arena.location_name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="flex items-center gap-1 text-sm font-medium text-gray-700 mb-2">
                                Price per Person (Rp)
                                <span class="relative group/tip inline-block"><svg class="w-3.5 h-3.5 text-gray-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-52 px-2.5 py-1.5 bg-gray-800 text-white text-xs rounded-lg shadow-lg invisible group-hover/tip:visible whitespace-normal z-20 pointer-events-none font-normal">Charged to non-members attending this session.</span></span>
                            </label>
                            <input type="number" name="price_per_person" value="{{ game.price_per_person }}" min="0" step="1000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                        </div>
                        <div>
                            <label class="flex items-center gap-1 text-sm font-medium text-gray-700 mb-2">
                                Price per Member (Rp)
                                <span class="relative group/tip inline-block"><svg class="w-3.5 h-3.5 text-gray-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-52 px-2.5 py-1.5 bg-gray-800 text-white text-xs rounded-lg shadow-lg invisible group-hover/tip:visible whitespace-normal z-20 pointer-events-none font-normal">Discounted rate for players with an active membership this month.</span></span>
                            </label>
                            <input type="number" name="price_per_member" value="{{ game.price_per_member }}" min="0" step="1000" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                            <label class="flex items-center gap-1 text-sm font-medium text-gray-700 mb-2">
                                Duration per Match (min)
                                <span class="relative group/tip inline-block"><svg class="w-3.5 h-3.5 text-gray-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-52 px-2.5 py-1.5 bg-gray-800 text-white text-xs rounded-lg shadow-lg invisible group-hover/tip:visible whitespace-normal z-20 pointer-events-none font-normal">How long one match between two teams runs (e.g. 8 min).</span></span>
                            </label>
                            <input type="number" name="duration_per_game" value="{{ game.duration_per_game }}" min="1" max="60" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                        </div>
                        <div>
                            <label class="flex items-center gap-1 text-sm font-medium text-gray-700 mb-2">
                                Session Duration (min)
                                <span class="relative group/tip inline-block"><svg class="w-3.5 h-3.5 text-gray-400 cursor-help" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span class="absolute left-1/2 -translate-x-1/2 bottom-full mb-2 w-52 px-2.5 py-1.5 bg-gray-800 text-white text-xs rounded-lg shadow-lg invisible group-hover/tip:visible whitespace-normal z-20 pointer-events-none font-normal">Total court time booked (e.g. 120 min). Used to check if the full schedule fits.</span></span>
                            </label>
                            <input type="number" name="session_duration" value="{{ game.session_duration }}" min="30" max="480" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-2">Max Players</label>
                            <input type="number" name="max_players" value="{{ game.max_players }}" min="2" max="100" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Status</label>
                        <select name="status" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">
                            <option value="open" {% if game.status == 'open' %}selected{% endif %}>Open</option>
                            <option value="closed" {% if game.status == 'closed' %}selected{% endif %}>Closed</option>
                            <option value="cancelled" {% if game.status == 'cancelled' %}selected{% endif %}>Cancelled</option>
                        </select>
                        <p class="text-xs text-gray-400 mt-1">Open = invite link active and players can register. Closed = registration stopped.</p>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Notes</label>
                        <textarea name="notes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-transparent">{{ game.notes or '' }}</textarea>
                    </div>

                    <div class="flex flex-wrap gap-4 pt-4">
                        <button type="submit" class="bg-accent text-white px-6 py-3 rounded-lg font-medium hover:bg-accent/90 transition">
                            Save Changes
                        </button>
                        <a href="/manage/games/{{ game.id }}" class="px-6 py-3 rounded-lg font-medium text-gray-600 hover:bg-gray-100 transition">
                            Cancel
                        </a>
                    </div>
                </form>
            </div>
        </main>
    </div>
</body>
</html>
