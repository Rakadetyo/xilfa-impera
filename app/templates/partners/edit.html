<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Partner — Impera</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        accent: '#C9A84C',
                        'accent-light': '#E5C878',
                        gold: '#71717A',
                    },
                    fontFamily: {
                        'display': ['Bangers', 'sans-serif'],
                        'accent': ['Permanent Marker', 'cursive'],
                        'body': ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Permanent+Marker&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">
    <div class="flex min-h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-white border-r border-gray-200 fixed h-full">
            <div class="p-6">
                <span class="text-lg font-display tracking-widest text-accent">IMPERA</span>
                <span class="text-xs text-gray-500 block mt-1">/ Manage</span>
            </div>

            <nav class="mt-6 px-4">
                <a href="/manage" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
                    Dashboard
                </a>
                <a href="/manage/posts" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    Posts
                </a>
                <a href="/manage/players" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Players
                </a>
                <a href="/manage/members" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Members
                </a>
                <a href="/manage/arena" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    Arenas
                </a>
                <a href="/manage/games" class="flex items-center gap-3 px-4 py-3 rounded-lg text-gray-600 hover:bg-gray-100">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    Games
                </a>
                <a href="/manage/partners" class="flex items-center gap-3 px-4 py-3 rounded-lg bg-accent text-black font-bold">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    Partners
                </a>
                <div class="mt-4 pt-4 border-t border-gray-200">
                    <p class="px-4 text-xs font-bold text-gray-400 uppercase tracking-widest mb-2">Page Settings</p>
                    <a href="/manage/page_settings/homepage" class="flex items-center gap-3 px-4 py-2 rounded-lg text-gray-600 hover:bg-gray-100 ml-2 text-sm">Homepage</a>
                </div>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="ml-64 flex-1 p-8">
            <div class="flex justify-between items-center mb-8">
                <h1 class="text-3xl font-display tracking-wide">Edit Partner</h1>
                <a href="/manage/partners" class="text-gray-500 hover:text-gray-700">← Back to Partners</a>
            </div>

            <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 max-w-2xl">
                <form method="post" action="/manage/partners/{{ partner.id }}/edit">
                    <div class="space-y-6">
                        <!-- Name -->
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Name *</label>
                            <input type="text" name="name" required value="{{ partner.name }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Company -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Company</label>
                            <input type="text" name="company" value="{{ partner.company or '' }}" placeholder="Company or organization they represent" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Types -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Types</label>
                            <div id="tag-container" class="flex flex-wrap gap-1.5 px-3 py-2 border border-gray-300 rounded-lg min-h-10 cursor-text relative" onclick="document.getElementById('tag-input').focus()">
                                <input id="tag-input" type="text" placeholder="Add type..." autocomplete="off" class="outline-none text-sm flex-1 min-w-24 bg-transparent">
                                <input id="types-hidden" type="hidden" name="types" value="{{ partner.types or '' }}">
                                <div id="tag-suggestions" class="hidden absolute left-0 top-full mt-1 w-48 bg-white border border-gray-200 rounded-lg shadow-lg z-10"></div>
                            </div>
                            <p class="text-xs text-gray-400 mt-1">Press Enter or comma to add. Click × to remove.</p>
                        </div>

                        <!-- Contact -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Contact</label>
                            <input type="text" name="contact" value="{{ partner.contact or '' }}" placeholder="WA/phone" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Social Media -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Social Media</label>
                            <input type="text" name="social_media" value="{{ partner.social_media or '' }}" placeholder="@handle or URL" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Default Fee -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Default Fee</label>
                            <input type="number" name="default_fee" min="0" step="1000" value="{{ partner.default_fee or 0 }}" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">
                        </div>

                        <!-- Internal Rating -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Internal Rating</label>
                            <div class="flex gap-1 rating-stars" id="rating-widget">
                                {% for i in range(1, 6) %}
                                <label class="cursor-pointer text-2xl">
                                    <input type="radio" name="internal_rating" value="{{ i }}" class="sr-only" {% if partner.internal_rating == i %}checked{% endif %}>
                                    <span class="star {% if partner.internal_rating and i <= partner.internal_rating %}text-accent{% else %}text-gray-300{% endif %} hover:text-accent transition">★</span>
                                </label>
                                {% endfor %}
                            </div>
                        </div>

                        <!-- Notes -->
                        <div>
                            <label class="block text-sm font-medium text-gray-500 mb-1">Notes</label>
                            <textarea name="notes" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-accent focus:border-accent">{{ partner.notes or '' }}</textarea>
                        </div>

                        <!-- Is Active -->
                        <div class="flex items-center gap-2">
                            <input type="checkbox" name="is_active" value="1" id="is_active" {% if partner.is_active == 1 %}checked{% endif %} class="w-4 h-4 text-accent border-gray-300 rounded focus:ring-accent">
                            <label for="is_active" class="text-sm text-gray-700">Active</label>
                        </div>

                        <!-- Submit -->
                        <div class="flex gap-3 pt-4">
                            <button type="submit" class="px-6 py-2 bg-accent text-white rounded-lg hover:bg-accent/90">Save Changes</button>
                            <a href="/manage/partners" class="px-6 py-2 border border-gray-300 rounded-lg hover:bg-gray-50">Cancel</a>
                        </div>
                    </div>
                </form>

                <!-- Delete -->
                <form method="post" action="/manage/partners/{{ partner.id }}/delete" class="mt-8 pt-6 border-t border-gray-200" onsubmit="return confirm('Deactivate this partner? This will hide them from the list but preserve game history.')">
                    <button type="submit" class="px-6 py-2 border border-red-300 text-red-600 rounded-lg hover:bg-red-50">Deactivate Partner</button>
                </form>
            </div>
        </main>
    </div>

    <script>
        const input = document.getElementById('tag-input');
        const container = document.getElementById('tag-container');
        const hidden = document.getElementById('types-hidden');
        const suggestions = document.getElementById('tag-suggestions');
        const suggestedTypes = {{ suggested_types | tojson }};

        let tags = hidden.value ? hidden.value.split(',').map(t => t.trim()).filter(Boolean) : [];

        function render() {
            container.querySelectorAll('.tag-chip').forEach(el => el.remove());
            tags.forEach(tag => {
                const chip = document.createElement('span');
                chip.className = 'tag-chip flex items-center gap-1 px-2 py-0.5 bg-accent/10 text-accent rounded-full text-sm';
                chip.innerHTML = `${tag} <button type="button" onclick="removeTag('${tag}')" class="hover:text-red-600">&times;</button>`;
                container.insertBefore(chip, input);
            });
            hidden.value = tags.join(',');
        }

        window.removeTag = function(tag) {
            tags = tags.filter(t => t !== tag);
            render();
        };

        function addTag(tag) {
            tag = tag.trim().toLowerCase();
            if (tag && !tags.includes(tag)) {
                tags.push(tag);
                render();
            }
            input.value = '';
            suggestions.classList.add('hidden');
        }

        input.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ',') {
                e.preventDefault();
                addTag(input.value);
            }
        });

        input.addEventListener('input', () => {
            const q = input.value.toLowerCase();
            if (!q) { suggestions.classList.add('hidden'); return; }
            const matches = suggestedTypes.filter(t => t.includes(q) && !tags.includes(t));
            if (!matches.length) { suggestions.classList.add('hidden'); return; }
            suggestions.innerHTML = matches.map(t =>
                `<div class="px-3 py-1.5 hover:bg-gray-100 cursor-pointer text-sm" onclick="addTag('${t}')">${t}</div>`
            ).join('');
            suggestions.classList.remove('hidden');
        });

        document.addEventListener('click', e => {
            if (!container.contains(e.target)) suggestions.classList.add('hidden');
        });

        render();

        // Rating stars
        document.querySelectorAll('.rating-stars input[type=radio]').forEach(radio => {
            radio.addEventListener('change', () => {
                const val = parseInt(radio.value);
                document.querySelectorAll('.rating-stars .star').forEach((star, idx) => {
                    star.className = star.className.replace(/text-(accent|gray-300)/g, '');
                    star.classList.add(idx < val ? 'text-accent' : 'text-gray-300');
                });
            });
        });
    </script>
</body>
</html>
